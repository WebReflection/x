<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script
    data-imports="
      custom-function/factory
      domconstants/constants
      domconstants/re
      create-contextual-content
      @webreflection/empty/array
      @webreflection/uparser
      udomdiff
      uhtml
      gc-hook
      gc-hook/track
    "
    src="https://esm.run/data-imports"
  ></script>
  <script type="module">
    import { render, html } from '../src/html.js';
    import Fragment from '../src/classes/fragment.js';

    class Component {
      #node = null;
      view() {
        throw new Error('unknown view()');
      }
      render() {
        let node;
        render(this, () => {
          node = this.view();
          return node;
        });
        return node;
      }
      replaceChildren(node) {
        this.#node = node;
      }
      valueOf() {
        return this.render();
      }
    }

    class Counter extends Component {
      constructor(i = 0) {
        super();
        this.i = i;
      }
      decrement = [() => {
        this.i--;
        this.render();
      }];
      increment = [() => {
        this.i++;
        this.render();
      }];
    }

    class FragmentCounter extends Counter {
      view() {
        return html`
          <button @click=${this.decrement}>-</button>
          ${this.i}
          <button @click=${this.increment}>+</button>
        `;
      }
    }

    function DivCounter(i) {
      return () => html`
        <div>
          <button @click=${() => {
            i--;
          }}>-</button>
          ${i}
          <button @click=${() => {
            i++;
          }}>+</button>
        </div>
      `;
    }

    class asd extends Counter {
      view = () => html`
        <div>
          <button @click=${this.decrement}>-</button>
          ${this.i}
          <button @click=${this.increment}>+</button>
        </div>
      `;
    }

    class KeyedCounter extends Counter {
      view = () => html`
        <div key=${'keyed-element'}>
          <button @click=${this.decrement}>-</button>
          ${this.i}
          <button @click=${this.increment}>+</button>
        </div>
      `;
    }

    (globalThis.render = () => {
      console.time('counters');
      debugger;
      render(document.body, DivCounter(1));
      return;
      render(document.body, () => html`
        <div>${[
          new FragmentCounter(0).valueOf(),
          new DivCounter(1).valueOf(),
          new KeyedCounter(2).valueOf(),
          new DivCounter(3).valueOf(),
        ]}</div>
      `);
      console.timeEnd('counters');
    })();
  </script>
</head>
</html>
