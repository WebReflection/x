<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script
    data-imports="
      custom-function/factory
      domconstants/constants
      domconstants/re
      create-contextual-content
      @webreflection/empty/array
      @webreflection/uparser
      udomdiff
      uhtml
    "
    src="https://esm.run/data-imports"
  ></script>
  <script type="module">
    import { render, html } from '../src/lib.js';
    import Fragment from '../src/classes/fragment.js';

    class Component {
      #node = null;
      #view = () => this.view();
      view() {
        throw new Error('unknown view()');
      }
      render() {
        render(this, this.#view);
        return this.#node;
      }
      replaceChildren(node) {
        this.#node = node;
      }
      valueOf() {
        return this.render();
      }
    }

    class Counter extends Component {
      constructor(i = 0) {
        super();
        this.i = i;
      }
      decrement = [() => {
        this.i--;
        this.render();
      }];
      increment = [() => {
        this.i++;
        this.render();
      }];
    }

    class FragmentCounter extends Counter {
      view() {
        return html`
          <button @click=${this.decrement}>-</button>
          ${this.i}
          <button @click=${this.increment}>+</button>
        `;
      }
    }

    class DivCounter extends Counter {
      view = () => html`
        <div>
          <button @click=${this.decrement}>-</button>
          ${this.i}
          <button @click=${this.increment}>+</button>
        </div>
      `;
    }

    (globalThis.render = () => {
      console.time('counters');
      // render(document.body, () => html`
      //   ${new FragmentCounter(0)}
      //   ${new DivCounter(1)}
      //   ${new DivCounter(2)}
      //   ${new DivCounter(3)}
      // `);
      render(document.body, () => html`
        <div>${[
          new FragmentCounter(0).valueOf(),
          new DivCounter(1).valueOf(),
          new DivCounter(2).valueOf(),
          new DivCounter(3).valueOf(),
        ]}</div>
      `);
      console.timeEnd('counters');
    })();
  </script>
</head>
</html>
