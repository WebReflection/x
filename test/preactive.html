<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script
    data-imports="
      custom-function/factory
      domconstants/constants
      domconstants/re
      create-contextual-content
      @webreflection/empty/array
      @webreflection/empty/arrow
      @webreflection/uparser
      @preact/signals-core
      udomdiff
      uhtml
      gc-hook
      gc-hook/track
    "
    src="https://esm.run/data-imports"
  ></script>
  <script type="module">
    import { render, html, signal } from '../src/signals/preact.js';

    // @see https://preactjs.com/guide/v10/signals/#introduction
    const count = signal(0);

    function Counter() {
      return html`
        <div>
          <p>Count: ${count.value}</p>
          <button @click=${() => { count.value++ }}>click me</button>
        </div>
      `;
    }

    let div = document.body.appendChild(
      document.createElement('div')
    );
    render(div, () => html`
      <div>
        <h3>Counter Demo</h3>
        ${Counter()}
        <hr />
      </div>
    `);

    setTimeout(() => {
      render(div, () => html`<div>gone</div>`);
      div = null;
    }, 5000);
  </script>
</head>
</html>
