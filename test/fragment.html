  <script type="module">
    import { render, html } from '../src/html.js';

    let i = 0;
    const update = (a, b) => {
      const first = i % 2 ? b : a;
      const second = first === a ? b : a;
      const children = () => html`
        <hr />
        ${[
          first(first === a ? [html`a`, html`b`, html`c`] : [html`e`, html`d`]),
          second(first === a ? [html`d`, html`e`] : [html`c`, html`b`, html`a`]),
        ]}
      `;
      // document.body.replaceChildren(children());
      render(document.body, children);
      i++;
      setTimeout(update, 2000, a, b);
    };

    update(
      data => html`
        <b>first</b>
        <br />
        ${data}
        <hr />
      `,
      data => html`
        <em>second</em>
        <br />
        ${data}
        <hr />
      `,
    );
